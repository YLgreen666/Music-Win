[package]
name = "rhine-music"
version = "0.1.0"
description = "Rhine Lab music player"
authors = ["Rhine Music contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
lofty = "0.25"
souvlaki = "0.8"
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Com"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
