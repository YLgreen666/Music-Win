<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>封面卡片材质检查</title></head><body>
<div id="viewport"><main id="stage" data-layout="desktop" data-mode="detail" data-boot="done"></main></div>
<nav id="review-controls" aria-label="封面回归检查"><button id="blue">蓝色封面</button><button id="warm">暖色封面</button><button id="original">原双环内构</button><button id="cover">封面卡片</button><button id="theme">切换亮暗</button><button id="viewer">360° 查看</button></nav>
<output id="review-status">载入真实场景…</output>
<script type="module">
import '../src/style.css'; import '../src/responsive.css'; import '../src/music.css';
import { ArchiveScene } from '../src/scene'; import { ModelViewer } from '../src/model-viewer';
import { musicShell } from '../src/music-shell'; import { setMusicCatalog } from '../src/data';
import { reducedMotion } from '../src/motion-preferences'; import { PageLifecycle } from '../src/music/lifecycle';
const svg = (color, accent) => new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000"><rect width="1000" height="1000" fill="${color}"/><circle cx="720" cy="400" r="230" fill="${accent}"/><path d="M70 730 H930 M70 756 H620" stroke="white" stroke-width="5"/><text x="70" y="640" fill="white" font-family="sans-serif" font-size="85">RHINE MUSIC</text><text x="75" y="690" fill="white" font-family="sans-serif" font-size="24">COVER MATERIAL STUDY</text></svg>`], {type:'image/svg+xml'});
const tracks = [
  {id:'blue', title:'蓝色封面', cover:svg('#2163a6','#6aadd8')},
  {id:'warm', title:'暖色封面', cover:svg('#bf5638','#f5aa65')},
].map(track=>({...track, providerId:'local', sourceId:track.id, artist:'Rhine Test', album:'材质回归样本', albumArtist:'Rhine Test', trackNumber:1, duration:12, format:'WAV', fileName:track.id+'.wav', folder:'Review', size:0, modified:0, availability:'missing'}));
setMusicCatalog(tracks,[{id:'review',kind:'album',name:'材质回归样本',trackIds:tracks.map(track=>track.id)}]);
const stage=document.querySelector('#stage'); stage.innerHTML=musicShell;
document.querySelector('#loading').remove(); document.querySelector('#boot').hidden=true;
document.querySelector('#skip').hidden=true; document.querySelector('#detail-ui').hidden=false;
const scene=new ArchiveScene(document.querySelector('#three-scene')); let viewer, selected=0, dark=false;
const fit=()=>{const scale=Math.min(innerWidth/1920,innerHeight/1080);stage.style.width='1920px';stage.style.height='1080px';stage.style.transform=`translate(-50%,-50%) scale(${scale})`;scene.resize();viewer?.resize();};
const describe=()=>{document.querySelector('#detail-content').innerHTML=`<span class="detail-eyebrow">COVER / MATERIAL REVIEW</span><h2>${tracks[selected].title}</h2><p>合成封面 · 四边窄留白 · 主色调玻璃</p>`;document.querySelector('#review-status').textContent=tracks[selected].title+' · 场景已就绪';};
await scene.load();scene.setMotion(reducedMotion());scene.refreshCatalog(0);scene.setCardStyle(true);scene.setMode('detail');scene.revealImmediately();describe();fit();
document.querySelector('#blue').onclick=()=>{selected=0;scene.select(0);describe();};
document.querySelector('#warm').onclick=()=>{selected=1;scene.select(1);describe();};
document.querySelector('#original').onclick=()=>scene.setCardStyle(false);
document.querySelector('#cover').onclick=()=>scene.setCardStyle(true);
document.querySelector('#theme').onclick=()=>{dark=!dark;scene.setTheme(dark,true);};
document.querySelector('#viewer').onclick=()=>{viewer??=new ModelViewer(stage,()=>{});viewer.setMotion(reducedMotion());viewer.open(tracks[selected].id,tracks[selected].title,()=>scene.createAssemblyModel(),true);};
window.addEventListener('resize',fit);
const lifecycle=new PageLifecycle(ms=>{if(!viewer?.isOpen)scene.update(ms/1000);viewer?.setTheme(scene.themeAmount);viewer?.update(ms/1000);},()=>{viewer?.dispose();scene.dispose();});
document.addEventListener('visibilitychange',()=>lifecycle.setHidden(document.hidden));window.addEventListener('pagehide',event=>lifecycle.pageHide(event.persisted));window.addEventListener('pageshow',()=>lifecycle.setHidden(document.hidden));lifecycle.start();
</script>
<style>#review-controls{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:99}#review-controls button{background:#eee9e1;padding:10px 14px;border:1px solid #afa08a;color:#272724;font-size:12px}#review-status{position:fixed;bottom:14px;left:20px;font:12px sans-serif;color:#686259}.system-nav,.back-button,.viewer-open,.archive-counter,.system-footer,.column-navigation,.archive-hint,.powered{display:none!important}#detail-content{padding:45px 40px;top:35%;opacity:1!important}#detail-content h2{font-size:42px;margin:24px 0}#detail-content p{font-size:17px}</style>
</body></html>
